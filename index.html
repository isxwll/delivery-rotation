<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>GB | Delivery Rotation</title>
<style>
:root{color-scheme:dark;--bg:#090a0b;--surface:#141517;--surface2:#1b1c1f;--line:#2d2e33;--muted:#a2a4aa;--text:#f5f5f7;--white:#f5f5f7;--ink:#111216;--green:#d9f4e2;--greenInk:#123c27}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;min-height:44px;border:1px solid var(--white);border-radius:12px;background:var(--white);color:var(--ink);padding:11px 15px;font-weight:650;transition:transform .12s ease,opacity .12s ease}button:active{transform:scale(.985)}button.secondary{background:transparent;color:var(--text);border-color:#44464c}button:disabled{opacity:.35;cursor:not-allowed}
.wrap{width:min(100%,820px);margin:0 auto;padding:18px 16px 42px}.top{padding:23px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#18191c,#101113);box-shadow:0 18px 45px #0003}.brand{display:flex;align-items:center;gap:17px;min-width:0}.brand img{width:78px;height:78px;object-fit:contain;background:#050505;border-radius:17px;padding:6px;flex:0 0 auto}.eyebrow{font-size:10px;letter-spacing:.15em;color:#b9bbc1;text-transform:uppercase;font-weight:650}.brand h1{font-size:clamp(25px,5vw,35px);letter-spacing:-.045em;line-height:1.1;margin:5px 0 0;font-weight:750;text-transform:none}.brand p{display:none}
.stats{display:grid;grid-template-columns:minmax(0,1fr);margin-top:22px}.stat{border:1px solid #303136;padding:14px 16px;border-radius:16px;background:#111214;display:flex;align-items:center;justify-content:space-between;gap:12px}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:650}.stat strong{font-size:28px;letter-spacing:-.04em;line-height:1}
.notice{margin-top:13px;padding:13px 15px;border:1px solid #303136;border-radius:14px;background:#1a1b1e;color:#d7d8dd;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:17px 0}.tabs button{background:#17181a;color:#c5c7cd;border:1px solid #303136;padding:11px 8px;min-width:0;font-size:13px}.tabs button.active{background:var(--white);color:var(--ink);border-color:var(--white)}
.section{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:21px;margin-top:13px;box-shadow:0 8px 28px #0002}.section h2{font-size:20px;letter-spacing:-.025em;margin:0 0 15px;font-weight:720}.sub{display:none}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.person{display:flex;align-items:center;gap:13px;border:1px solid #303136;border-radius:16px;padding:14px;margin-top:9px;background:#191a1d;min-width:0}.rank{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border-radius:12px;background:#292a2e;color:#f5f5f7;font-weight:750}.person-main{flex:1;min-width:0}.person-name{font-weight:680;font-size:15px;line-height:1.35;overflow-wrap:break-word;word-break:normal;white-space:normal}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.points{font-size:17px;font-weight:750;white-space:nowrap;letter-spacing:-.025em}.person-actions{display:flex;gap:7px;flex:0 0 auto;align-items:center}.person-actions button{padding:9px 11px;min-height:40px;font-size:12px;white-space:nowrap}.tag{display:inline-flex;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.07em;border:1px solid #55565b;border-radius:999px;padding:3px 8px;color:#ddd;vertical-align:middle;margin-left:5px}.tag.on{background:var(--green);border-color:var(--green);color:var(--greenInk)}.empty{padding:30px 15px;text-align:center;border:1px dashed #414247;color:var(--muted);border-radius:16px;line-height:1.6}.hidden{display:none!important}.footer{color:#777980;font-size:10px;text-align:center;margin-top:20px;letter-spacing:.04em}.callout{display:none}dialog{box-shadow:0 24px 80px #0008}
@media(max-width:600px){.wrap{padding:11px 12px 32px}.top{padding:17px;border-radius:22px}.brand{gap:12px}.brand img{width:61px;height:61px;border-radius:14px;padding:5px}.eyebrow{font-size:9px;letter-spacing:.12em}.brand h1{font-size:25px}.stats{margin-top:17px}.stat{padding:12px 14px;border-radius:14px}.stat span{font-size:10px;letter-spacing:.08em}.stat strong{font-size:25px}.notice{font-size:12px;padding:12px 13px}.tabs{gap:6px;margin:13px 0}.tabs button{font-size:12px;padding:10px 4px;border-radius:11px}.section{padding:15px;border-radius:19px}.section h2{font-size:19px;margin-bottom:12px}.person{padding:12px;gap:10px;border-radius:15px}.rank{flex-basis:32px;width:32px;height:32px;border-radius:10px}.person-name{font-size:14px}.points{font-size:15px}.person-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%}.person-actions button{width:100%;min-width:0;white-space:normal;line-height:1.2;padding:9px 5px;font-size:11px;min-height:42px}.person.team-card{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.person.team-card .person-main{grid-column:1}.person.team-card .rank{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <img src="gb-logo.png" alt="GB Service Solution Installation logo">
    <div><div class="eyebrow">GB Service Solution Installation</div><h1>Delivery Rotation</h1></div>
  </div>
  <div class="stats"><div class="stat"><span>Candidatos de hoje</span><strong id="statCandidates">0</strong></div></div>
</header>
<nav class="tabs" aria-label="Navegação principal">
  <button class="active" data-tab="priority">Lista de prioridade</button>
  <button class="secondary" data-tab="team">Team Points</button>
</nav>
<section id="tab-priority" class="section">
  <h2>Lista de prioridade</h2>
  <div id="priorityList"></div>
</section>
<section id="tab-team" class="section hidden">
  <h2>Team Points</h2>
  <div id="teamList"></div>
</section>
<div class="footer">GB SERVICE SOLUTION INSTALLATION</div>
</div>

<dialog id="confirmDialog" style="max-width:360px;width:calc(100% - 32px);background:#111;color:white;border:1px solid #555;border-radius:6px;padding:20px">
  <h2 id="dialogTitle" style="margin-top:0;font-size:18px">Confirmar ação</h2>
  <p id="dialogText" style="color:#ccc;font-size:14px"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="secondary" id="dialogCancel">Cancelar</button><button id="dialogConfirm">Confirmar</button></div>
</dialog>
<script>
const STORAGE_KEY='gb_delivery_rotation_final_v3';
const OPEN_MIN=7*60, CLOSE_MIN=14*60;
const londonParts=(date=new Date())=>Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
const todayKey=()=>{const p=londonParts();return `${p.year}-${p.month}-${p.day}`};
const defaultTeam=[
 {id:1,name:'GUSTAVO OLIVEIRA',points:0,lastDelivery:null},
 {id:2,name:'Saul Teixeira',points:1,lastDelivery:null},
 {id:3,name:'SHAULO SILVA',points:2,lastDelivery:null},
 {id:4,name:'GIULIANO DIAS',points:0,lastDelivery:null},
 {id:5,name:'ADAM MEDEIROS',points:0,lastDelivery:null},
 {id:6,name:'Marcos Venancio',points:0,lastDelivery:null},
 {id:7,name:'RENATO MOURA',points:1,lastDelivery:null},
 {id:8,name:'Isaac Freitas',points:1,lastDelivery:null},
 {id:9,name:'CARLOS HENRIQUE',points:1,lastDelivery:null},
 {id:10,name:'ANDERSON MARSON',points:1,lastDelivery:null},
 {id:11,name:'DIMITRI TEIXEIRA',points:2,lastDelivery:null},
 {id:12,name:'THALES CASTRO',points:0,lastDelivery:null}
];
let state;
function fresh(){return {team:structuredClone(defaultTeam),candidates:[],candidateDate:todayKey()}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&Array.isArray(x.team)){state=x;if(state.candidateDate!==todayKey()){state.candidates=[];state.candidateDate=todayKey();save()}}else state=fresh()}catch(e){state=fresh()}save()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(date){if(!date)return 'Última delivery: sem data registrada';const d=new Date(date+'T12:00:00Z');return `Última delivery: ${new Intl.DateTimeFormat('pt-BR',{timeZone:'Europe/London',day:'2-digit',month:'short',year:'numeric'}).format(d)}`}
function londonMinutes(){const p=londonParts();return Number(p.hour)*60+Number(p.minute)}
function candidatesAllowed(){const mins=londonMinutes();return mins>=OPEN_MIN&&mins<CLOSE_MIN}
function compare(a,b){if(a.points!==b.points)return a.points-b.points;const ad=a.lastDelivery?new Date(a.lastDelivery+'T00:00:00Z').getTime():-Infinity;const bd=b.lastDelivery?new Date(b.lastDelivery+'T00:00:00Z').getTime():-Infinity;if(ad!==bd)return ad-bd;return a.id-b.id}
function personCard(p,i,showActions=false){return `<div class="person ${showActions?'team-card':''}"><div class="rank">${i+1}</div><div class="person-main"><div class="person-name">${esc(p.name)} ${state.candidates.includes(p.id)?'<span class="tag on">Candidatou-se</span>':''}</div><div class="meta">${dateLabel(p.lastDelivery)}</div></div><div class="points">${p.points} pts</div>${showActions?`<div class="person-actions">${state.candidates.includes(p.id)?`<button class="secondary" data-action="uncandidate" data-id="${p.id}">Retirar candidatura</button>`:`<button data-action="candidate" data-id="${p.id}" ${(!candidatesAllowed()||state.candidateDate!==todayKey())?'disabled':''}>Candidatar-me</button>`}<button class="secondary" data-action="delivery" data-id="${p.id}">Registrar delivery</button></div>`:''}</div>`}
function render(){
 document.getElementById('statCandidates').textContent=state.candidates.length;
 const candidates=state.team.filter(p=>state.candidates.includes(p.id));
 const priority=[...candidates].sort(compare);
 document.getElementById('priorityList').innerHTML=priority.length?priority.map((p,i)=>personCard(p,i,false)).join(''):'<div class="empty">A lista de prioridade aparecerá quando houver candidatos.</div>';
 document.getElementById('teamList').innerHTML=state.team.map((p,i)=>personCard(p,i,true)).join('');
}
function showConfirm(title,text,action){const d=document.getElementById('confirmDialog');document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=text;pendingAction=action;d.showModal()}
let pendingAction=null;
document.getElementById('dialogCancel').onclick=()=>document.getElementById('confirmDialog').close();
document.getElementById('dialogConfirm').onclick=()=>{document.getElementById('confirmDialog').close();if(pendingAction)pendingAction();pendingAction=null};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.classList.toggle('secondary',x!==b)});document.querySelectorAll('[id^="tab-"]').forEach(s=>s.classList.toggle('hidden',s.id!==`tab-${b.dataset.tab}`));}));
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id),p=state.team.find(x=>x.id===id);if(!p)return;
 if(b.dataset.action==='candidate'){if(!candidatesAllowed()){alert('As candidaturas estão abertas apenas das 07:00 às 14:00, horário de Londres.');return}if(!state.candidates.includes(id)){state.candidates.push(id);save();render()}}
 if(b.dataset.action==='uncandidate'){state.candidates=state.candidates.filter(x=>x!==id);save();render()}
 if(b.dataset.action==='delivery'){showConfirm('Confirmar delivery?',`Registrar uma delivery concluída para ${p.name}? Isso adicionará 1 ponto.`,()=>{p.points++;p.lastDelivery=todayKey();save();render()})}
});
load();render();
setInterval(()=>{if(state.candidateDate!==todayKey()){state.candidates=[];state.candidateDate=todayKey();save()}render()},30000);
</script>
</body>
</html>
